; GarageLink — MQTT Subscriber için Supervisor konfigürasyonu
; Linux/prod sunucu için
;
; Kurulum:
;   sudo cp supervisor.conf /etc/supervisor/conf.d/garagelink-mqtt.conf
;   # Dosyada /path/to/project kısmını gerçek yol ile değiştir
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start garagelink-mqtt
;
; Durum kontrolü:
;   sudo supervisorctl status garagelink-mqtt
;
; Loglar:
;   tail -f /var/log/garagelink-mqtt.out.log

[program:garagelink-mqtt]
command=php /path/to/project/artisan mqtt:subscribe
directory=/path/to/project
autostart=true
autorestart=true
startretries=99
startsecs=3
stopwaitsecs=10
stderr_logfile=/var/log/garagelink-mqtt.err.log
stdout_logfile=/var/log/garagelink-mqtt.out.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
user=www-data
